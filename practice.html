<section>
<h2>اليوم 1: ماذا يعني الرقم هنا؟</h2>
<ol>
<li><p>تطبيق لساعة يد يسوَّق تحت عنوان «لياقة ونمط حياة». يقرأ نبض القلب، وإذا وجد نمطًا غير منتظم كتب للمستخدم: «احتمال رجفان أذيني، راجع طبيبًا». هل هو جهاز طبي؟</p><ul><li><b>أ.</b> لا، فالمورِّد صنّفه تطبيقًا للياقة ونمط الحياة</li><li><b>ب.</b> نعم، لأنه يكشف حالة مرضية محتملة لشخص بعينه</li><li><b>ج.</b> نعم، لأنه يستخدم نموذج تعلم آلي</li><li><b>د.</b> لا، لأن الطبيب لا يرى نتيجته</li></ul></li>
<li><p>نظام لتذكير المرضى بمواعيدهم يعمل في مراكزكم، وليس جهازًا طبيًا. يصل إصدار جديد يقرأ نتائج التحاليل و«يقترح من يحتاج إلى مراجعة عاجلة»، والمورِّد يصفه بأنه تحديث اعتيادي. ما أول ما تفعله؟</p><ul><li><b>أ.</b> تثبّته، فالمورِّد مسؤول عن تصنيف تحديثاته أمام الهيئة</li><li><b>ب.</b> تثبّته وتطلب من الأطباء مراجعة كل اقتراح</li><li><b>ج.</b> تطلب من المورِّد بيان أداء النموذج الجديد قبل التثبيت</li><li><b>د.</b> توقف التثبيت وتعيد الحكم في الغرض مع الشؤون التنظيمية</li></ul></li>
<li><p>الأداة نفسها، بالحساسية والنوعية نفسيهما، تعمل في الطوارئ وفي فحوص ما قبل التوظيف. في أيهما يصح عدد أكبر من كل 100 تنبيه، ولماذا؟</p><ul><li><b>أ.</b> الطوارئ، لأن انتشار الحالة بين المصوَّرين فيها أعلى</li><li><b>ب.</b> كلاهما سواء، فالأداة واحدة والعتبة واحدة</li><li><b>ج.</b> فحوص التوظيف، لأن عدد صورها في اليوم أكبر</li><li><b>د.</b> فحوص التوظيف، لأن الحالات فيها نادرة فيسهل تمييزها</li></ul></li>
<li><p>مورِّد أداة فرز يعرض حساسية 90% من ثلاثة مستشفيات جامعية، أغلب صورها قياسية. 80% من صور طوارئكم متنقلة. ما أول ما تطلبه؟</p><ul><li><b>أ.</b> عينة اختبار أكبر من المستشفيات الجامعية الثلاثة نفسها</li><li><b>ب.</b> لا شيء، فالحساسية 90% كافية للطوارئ</li><li><b>ج.</b> الحساسية للصور المتنقلة وحدها، ثم تحقق محلي على صورنا</li><li><b>د.</b> دقة الأداة الإجمالية على صور المستشفيات الثلاثة كلها</li></ul></li>
<li><p>في موقع يستطيع قارئه أن يقطع عمله لـ40 تنبيهًا في اليوم، تعطي العتبات الثلاث 70 و35 و15 تنبيهًا يوميًا. أيها تختار، وماذا تكتب للمجلس؟</p><ul><li><b>أ.</b> العتبة الأولى، لأنها تفوّت أقل عدد من الحالات</li><li><b>ب.</b> العتبة الثالثة، لأن تنبيهاتها الكاذبة أقل</li><li><b>ج.</b> العتبة التي يوصي بها المورِّد، أيًّا كانت</li><li><b>د.</b> العتبة الثانية، مع عدد الحالات الفائتة بها في الشهر</li></ul></li>
<li><p>نظام في جناح الولادة يقرأ تخطيط قلب الجنين كل دقيقة، ويطلق تنبيهًا للقابلة حين يشتبه في ضائقة جنينية. المورِّد يصفه بأنه «أداة لتنظيم عبء العمل في الجناح». هل هو جهاز طبي؟</p><ul><li><b>أ.</b> لا، لأن المورِّد وصفه أداة لتنظيم العمل</li><li><b>ب.</b> نعم، لأنه يراقب حالة الجنين ويكشف خطرًا عليه</li><li><b>ج.</b> لا، لأن القابلة هي التي تقرر بعد التنبيه</li><li><b>د.</b> نعم، لأنه يعمل في جناح سريري داخل المستشفى</li></ul></li>
<li><p>نظام يتنبأ بعدد المراجعين في كل مركز صحي كل أسبوع لتوزيع الممرضين، ويقرأ سجل المواعيد بأسماء المرضى وأعمارهم. صنّفه الفريق «ليس جهازًا طبيًا». ما الذي يلزمه قبل التشغيل؟</p><ul><li><b>أ.</b> لا شيء، فالأدوات غير الطبية لا تخضع لأي متطلبات قبل تشغيلها</li><li><b>ب.</b> إذن تسويق من الهيئة العامة للغذاء والدواء، كأي أداة صحية</li><li><b>ج.</b> أساس نظامي للبيانات الصحية، ومالك واختبار محلي</li><li><b>د.</b> تحقق سريري على مرضى الشبكة قبل التشغيل</li></ul></li>
<li><p>أداة لقراءة صور الثدي معتمدة جهازًا طبيًا وتعمل في الشبكة. يعلن المورِّد إصدارًا جديدًا دُرِّب على صور من أجهزة تصوير مختلفة، ويقول إن النتائج «أفضل». ماذا تطلب قبل التثبيت؟</p><ul><li><b>أ.</b> وصف التغيير، وقرارًا بإعادة التحقق على صورنا</li><li><b>ب.</b> لا شيء، فالأداة معتمدة من قبل والإصدار الجديد يحسّنها</li><li><b>ج.</b> إيقاف الأداة نهائيًا لأن نموذجها تغيّر</li><li><b>د.</b> شهادة من المورِّد بأن الإصدار لا يغيّر الغرض المقصود</li></ul></li>
<li><p>مساعد محادثة عام اشترته الشبكة لصياغة المراسلات، وشروط مورِّده تقول إنه «غير مخصص لأغراض طبية». تكتشف الجودة أن طبيبًا يسأله عن جرعات الأدوية للأطفال. على من تقع مسؤولية هذا الاستخدام؟</p><ul><li><b>أ.</b> على المورِّد، لأن أداته أجابت عن سؤال طبي</li><li><b>ب.</b> على الطبيب وحده، والشبكة لا شأن لها</li><li><b>ج.</b> لا أحد، لأن المنتج ليس جهازًا طبيًا</li><li><b>د.</b> على الطبيب والشبكة، فالاستخدام خارج غرضه</li></ul></li>
<li><p>أداة معتمدة لفرز صور الرأس نبّهت على نزيف، وقرأ أخصائي الأشعة الصورة وأكّد التشخيص، ثم تبيّن أنه خطأ. من يُسأل سريريًا عن التشخيص؟</p><ul><li><b>أ.</b> المورِّد، لأن أداته المعتمدة أطلقت التنبيه</li><li><b>ب.</b> الجهة، لأنها اشترت الأداة</li><li><b>ج.</b> لا أحد، لأن الخطأ مشترك بين الأداة والإنسان</li><li><b>د.</b> أخصائي الأشعة الذي قرأ الصورة وأكّد التشخيص</li></ul></li>
<li><p>موقع يصوّر 300 صورة صدر في اليوم، وانتشار الحالة بين المصوَّرين 2%. حساسية الأداة 80% ونوعيتها 90%. كم تنبيهًا تتوقع في اليوم؟ (قرّب إلى أقرب عدد صحيح) <span class="unit">(تنبيهًا)</span></p></li>
<li><p>في الموقع نفسه (300 صورة، انتشار 2%، حساسية 80%، نوعية 90%)، من كل 100 تنبيه كم يكون صحيحًا تقريبًا؟</p><ul><li><b>أ.</b> نحو 2</li><li><b>ب.</b> نحو 14</li><li><b>ج.</b> نحو 80</li><li><b>د.</b> نحو 90</li></ul></li>
<li><p>موقع يصوّر 200 صورة في اليوم، وانتشار الحالة 4%، وحساسية الأداة 75%. كم حالة تفوت الأداة في شهر من 30 يومًا؟ <span class="unit">(حالة)</span></p></li>
<li><p>أداة فرز حساسيتها 78% على كل الصور، و70% على الصور المتنقلة، و82% على القياسية. في وحدة العناية المركزة كل الصور متنقلة. أي حساسية تستخدم لحساب الحالات الفائتة في العناية؟</p><ul><li><b>أ.</b> 70%</li><li><b>ب.</b> 76%</li><li><b>ج.</b> 78%</li><li><b>د.</b> 82%</li></ul></li>
<li><p>قارئ الطوارئ يستطيع أن يقطع عمله لـ25 تنبيهًا في اليوم. العتبات الأربع تعطي 60 و24 و12 و6 تنبيهات يوميًا، وتفوّت 10 و22 و35 و50 حالة في الشهر. أي عتبة تختار؟</p><ul><li><b>أ.</b> التي تعطي 60 تنبيهًا وتفوّت 10</li><li><b>ب.</b> التي تعطي 24 تنبيهًا وتفوّت 22</li><li><b>ج.</b> التي تعطي 12 تنبيهًا وتفوّت 35</li><li><b>د.</b> التي تعطي 6 تنبيهات وتفوّت 50</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من يتضرر، ومن يراقب؟</h2>
<ol>
<li><p>مورِّد يعرض أداة فرز «دقتها 94%»، اختُبرت على مجموعة انتشار الحالة فيها 10%. في مراكز الرعاية الأولية عندكم الانتشار 0.2%. ما أول ما تقوله للمجلس؟</p><ul><li><b>أ.</b> الدقة 94% تكفي، فنشغّلها في المراكز كلها</li><li><b>ب.</b> الانتشار عندنا أقل، فالتنبيهات الكاذبة ستقل في المراكز</li><li><b>ج.</b> نحتاج الحساسية والنوعية لنحسب الرقمين عند انتشارنا</li><li><b>د.</b> الأداة جهاز طبي، فلا يقرر فيها المجلس</li></ul></li>
<li><p>درجة لاختيار مرضى زيارات منزلية دُرِّبت على «عدد زيارات الطوارئ المسجلة في السنة التالية». سكان حي جديد لا تصله المواصلات العامة يزورون الطوارئ أقل. ما الذي تتوقعه؟</p><ul><li><b>أ.</b> يُعطى سكان الحي درجات أقل من حاجتهم، فيفوتهم البرنامج</li><li><b>ب.</b> يُعطون الدرجة التي يستحقونها، لأن الدرجة تقيس المرض</li><li><b>ج.</b> لا أثر، لأن الدرجة لا تستعمل مكان السكن</li><li><b>د.</b> يُعطون درجات أعلى من حاجتهم، لأن زياراتهم نادرة</li></ul></li>
<li><p>تدقّق درجة لاختيار مرضى برنامج. أي نتيجة وحدها تُثبت أن الدرجة تظلم فئة من المرضى؟</p><ul><li><b>أ.</b> الفئة تأخذ عددًا من المقاعد أقل من الفئات الأخرى</li><li><b>ب.</b> الدرجة ترتّب التكلفة الفعلية ترتيبًا جيدًا في الشبكة كلها</li><li><b>ج.</b> الدرجة تستعمل مكان السكن مدخلًا من مدخلاتها</li><li><b>د.</b> المسجَّل من الفئة أشد مرضًا من غيره عند الدرجة نفسها</li></ul></li>
<li><p>قيّم فريقك 20 ملاحظة كتبتها أداة توثيق، ولم يجد خطأ جسيمًا في أي منها. المورِّد يقترح التشغيل في كل العيادات. ماذا تقول؟</p><ul><li><b>أ.</b> لا أخطاء جسيمة في العينة، فالتشغيل آمن في كل العيادات</li><li><b>ب.</b> العينة لا تستبعد نسبة كبيرة: نحتاج تجربة صامتة أكبر</li><li><b>ج.</b> نرفض الأداة، فالعينة أصغر من أن نثق بها</li><li><b>د.</b> نعتمد رقم المورِّد، فعينته أكبر من عينتنا</li></ul></li>
<li><p>تكتب خطة التجربة الصامتة لأداة توثيق في ثلاث عيادات. أي سطر تضعه معيارًا للإيقاف قبل التشغيل؟</p><ul><li><b>أ.</b> نتابع جودة الملاحظات عن قرب طوال التجربة</li><li><b>ب.</b> لا ننتقل إن قل رضا الأطباء عن 80%</li><li><b>ج.</b> لا ننتقل إن تجاوزت الأخطاء الجسيمة 5 لكل 100 ملاحظة</li><li><b>د.</b> لا ننتقل إن رأى المورِّد أن أداء الأداة في عياداتنا غير كافٍ</li></ul></li>
<li><p>أداة تقترح جرعة مضاد التخثر لمرضى العيادة، ويعتمدها الصيدلي قبل الصرف. الخطأ في الجرعة قد يسبب نزيفًا. ما مستواها في مقياس الخريطة، وما شرطها؟</p><ul><li><b>أ.</b> عالٍ، ومراجعها صيدلي مسمّى وطريقة استفسار مكتوبة</li><li><b>ب.</b> منخفض، لأن الصيدلي يراجع كل جرعة قبل الصرف</li><li><b>ج.</b> متوسط، لأن الضرر جسيم والأداة لا تشخّص</li><li><b>د.</b> يحدده عدد المرضى الذين تمسّهم الأداة كل شهر</li></ul></li>
<li><p>درجة لاختيار مرضى السكري لبرنامج تثقيف مكثف دُرِّبت على «عدد الوصفات المصروفة في السنة التالية». ما الذي تتعلمه الدرجة فعلًا؟</p><ul><li><b>أ.</b> شدة مرض السكري عند كل مريض</li><li><b>ب.</b> حاجة المريض إلى التثقيف</li><li><b>ج.</b> ما يُصرف له في صيدلياتنا المسجلة</li><li><b>د.</b> مدى التزام المريض بخطة علاجه</li></ul></li>
<li><p>في تدقيق درجة لبرنامج رعاية: متوسط الأمراض غير المضبوطة بين المسجَّلين 2.6 لمن يعيشون في البادية و1.5 لمن يعيشون في المدينة. ماذا يعني ذلك؟</p><ul><li><b>أ.</b> سكان البادية أشد مرضًا عمومًا، والدرجة تعكس ذلك بدقة</li><li><b>ب.</b> ساكن البادية يحتاج إلى مرض أشد ليدخل، فالدرجة تظلمه</li><li><b>ج.</b> البرنامج يختار الأشد مرضًا من البادية، وهذا عدل</li><li><b>د.</b> الفرق صغير لا يستحق التدقيق</li></ul></li>
<li><p>في فئة من المرضى 200 صاحب حاجة عالية، سُجِّل منهم في البرنامج 50. ما نسبة من فاتهم البرنامج من أصحاب الحاجة العالية في هذه الفئة؟ <span class="unit">(%)</span></p></li>
<li><p>مراجعة الملفات تجد في المراكز الريفية 100 مرض مزمن، رُمِّز منها في النظام 55. وفي المدينة 100، رُمِّز منها 90. درجة تعتمد على الأمراض المرمَّزة. ما أثر ذلك؟</p><ul><li><b>أ.</b> تخفض درجات المراكز الريفية، لأن ما لا يُرمَّز لا تراه الدرجة</li><li><b>ب.</b> لا أثر، لأن الدرجة تعدّ الأمراض بالطريقة نفسها في الموقعين</li><li><b>ج.</b> ترفع درجات المراكز الريفية، لأن أمراضها أشد</li><li><b>د.</b> تخفض درجات المدينة، لأن ترميزها أكثر اكتمالًا</li></ul></li>
<li><p>فريق يريد إرسال 5,000 سجل إلى مورِّد لتدقيق درجته. حذف الأسماء وأرقام الهوية، وأبقى العمر والجنس والقرية والأمراض. هل صارت البيانات مجهولة؟</p><ul><li><b>أ.</b> نعم، لأن المعرِّفات المباشرة حُذفت</li><li><b>ب.</b> نعم، لأن البيانات تُرسل لغرض التدقيق فقط</li><li><b>ج.</b> لا، لأن السجلات ما زالت تحوي أعمارًا</li><li><b>د.</b> لا، لأن تجمّع السمات قد يدل على شخص بعينه</li></ul></li>
<li><p>في الزيارة قالت المريضة إنها تأخذ مميِّعًا للدم منذ جلطة. الملاحظة المولَّدة ذكرت دواء الضغط وحده. كل جملة في الملاحظة صحيحة. كيف تصنّف ذلك؟</p><ul><li><b>أ.</b> ملاحظة سليمة، لأن كل جملة فيها صحيحة</li><li><b>ب.</b> نتيجة مختلقة، لأن الملاحظة غيّرت قائمة الأدوية</li><li><b>ج.</b> إغفال غير جسيم، لأن دواء الضغط ذُكر</li><li><b>د.</b> إغفال جسيم، لأن غياب المميِّع قد يضر المريضة</li></ul></li>
<li><p>مورِّد يقول إن أداته «توفّر 70% من وقت التوثيق». عندكم قياس سابق: 6 دقائق للكتابة اليدوية. في أسبوع تجريبي أخذت مراجعة الملاحظة المولَّدة وتصحيحها 3.6 دقيقة في المتوسط. ما التوفير المقيس؟</p><ul><li><b>أ.</b> نحو 30%</li><li><b>ب.</b> نحو 40%</li><li><b>ج.</b> نحو 60%</li><li><b>د.</b> نحو 70%</li></ul></li>
<li><p>شبكة تريد أن تعرف أداء أداة توثيق على مرضاها الجدد قبل أن يعتمد الأطباء على ملاحظاتها. أي تصميم يفعل ذلك؟</p><ul><li><b>أ.</b> تعمل على الزيارات وتُحفظ ملاحظاتها خارج الملف، ويقارنها مراجع بالنص</li><li><b>ب.</b> تعمل الأداة في عيادة واحدة ويستعمل أطباؤها ملاحظاتها، ثم يُسألون عن رضاهم</li><li><b>ج.</b> يُطلب من المورِّد تقرير أداء من مستشفيات أخرى استعملت الأداة</li><li><b>د.</b> تُختبر الأداة على عشرين زيارة قديمة، ثم تُشغَّل في كل العيادات</li></ul></li>
<li><p>خطة لتجربة أداة توثيق تقول: «يراقب قسم الجودة أداء الأداة، ويُرفع تقرير عند الحاجة». ما الذي ينقصها أولًا؟</p><ul><li><b>أ.</b> اسم المورِّد ورقم إصدار الأداة</li><li><b>ب.</b> مقياس محسوب ومسؤول مسمّى ومعيار إيقاف برقم</li><li><b>ج.</b> عدد العيادات التي ستعمل فيها الأداة بعد التشغيل</li><li><b>د.</b> استبانة لرضا الأطباء عن الملاحظات</li></ul></li>
<li><p>قيّم فريق 20 ملاحظة، فوجد خطأ جسيمًا في 4 منها (20%). جدول حدود العينة يقول إن ذلك يتوافق مع نسبة حقيقية بين 8% و42%. ماذا تكتب في تقرير التحقق المحلي؟</p><ul><li><b>أ.</b> نسبة الخطأ الجسيم في الأداة 20%</li><li><b>ب.</b> نسبة الخطأ الجسيم في الأداة 42% على الأسوأ، فنرفضها</li><li><b>ج.</b> وجدنا 4 من 20 (من 8% إلى 42%)، ونحتاج عينة أكبر</li><li><b>د.</b> العينة صغيرة، فلا نكتب أي نسبة</li></ul></li>
<li><p>أداة تكتب ملخص زيارة للمريض بلغة بسيطة بعد أن يراجعه الطبيب. الخطأ قد يربك المريض لكنه لا يغيّر علاجه. ما مستوى مخاطرها في مقياس الخريطة؟</p><ul><li><b>أ.</b> منخفض</li><li><b>ب.</b> متوسط</li><li><b>ج.</b> عالٍ</li><li><b>د.</b> لا يُحدد قبل التشغيل</li></ul></li>
<li><p>حالتان في خريطتك: (أ) القيمة 5 والجاهزية 1 والمستوى عالٍ؛ (ب) القيمة 3 والجاهزية 5 والمستوى منخفض. تختار مشروعًا تجريبيًا واحدًا هذا العام. أي تعليل يصمد أمام المجلس؟</p><ul><li><b>أ.</b> (أ)، لأن أعلى قيمة يجب أن تبدأ أولًا مهما كانت البيانات</li><li><b>ب.</b> (ب)، فحاصلها 15 مقابل 5، وأكتب ما يلزم (أ) لتجهز</li><li><b>ج.</b> (أ)، لأن الحالات العالية المخاطر أهم من غيرها</li><li><b>د.</b> لا هذه ولا تلك، لأن كلتيهما تنقصها بيانات</li></ul></li>
<li><p>حالة استخدام قيمتها 4 وجاهزية بياناتها 3. ما رتبتها في الخريطة بحاصل القيمة × الجاهزية؟</p></li>
<li><p>في خريطة مشارك حالة عالية المخاطر، وفي عمود المراجع البشري: «فريق الجودة». ما الذي تقوله له قبل المناقشة؟</p><ul><li><b>أ.</b> يكفي، فالفريق أوسع وأقدر من أي شخص بمفرده</li><li><b>ب.</b> احذف الحالة، فالحالات العالية لا تدخل الخريطة</li><li><b>ج.</b> سمِّ طبيبًا بعينه مراجعًا، واكتب كيف يستفسر المريض</li><li><b>د.</b> غيّر مستواها إلى متوسط حتى لا تحتاج إلى مراجع</li></ul></li>
<li><p>حالة استخدام: التنبؤ بالطلب على أسرّة العناية. بيانات الدخول والخروج كاملة ومنظمة لخمس سنوات في نظام واحد، والإشغال الفعلي لكل يوم مسجل فيها مرجعًا نقيس عليه. ما درجة جاهزية البيانات في مقياس الخريطة؟</p><ul><li><b>أ.</b> 1</li><li><b>ب.</b> 3</li><li><b>ج.</b> 5</li></ul></li>
</ol>

},"level":"apply","pool":"practice"},{"id":"q-alerts-03","type":"numeric","prompt":"موقع يصوّر 200 صورة في اليوم، وانتشار الحالة 4%، وحساسية الأداة 75%. كم حالة تفوت الأداة في شهر من 30 يومًا؟","options":[],"correct":[],"answer":60,"tolerance":0,"unit":"حالة","explanation":"المرضى 200 × 0.04 = 8 في اليوم، يفوت منهم 8 × 0.25 = 2، أي 60 في الشهر.","misconceptions":[],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"two-numbers-for-a-board","title":"رقمان يقرر بهما المجلس: تنبيهات في اليوم، وحالات فائتة في الشهر"},"level":"apply","pool":"practice"},{"id":"q-alerts-04","type":"single","prompt":"أداة فرز حساسيتها 78% على كل الصور، و70% على الصور المتنقلة، و82% على القياسية. في وحدة العناية المركزة كل الصور متنقلة. أي حساسية تستخدم لحساب الحالات الفائتة في العناية؟","options":[{"key":"أ","text":"70%"},{"key":"ب","text":"76%"},{"key":"ج","text":"78%"},{"key":"د","text":"82%"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الوحدة لا تصوّر إلا صورًا متنقلة، فحساسيتها حساسية هذه الفئة. المتوسط يخفي الفئة التي تخطئ فيها الأداة أكثر.","misconceptions":["","يأخذ متوسط الفئتين دون وزن: مزيج العناية كله متنقل","يستخدم المتوسط العام: هو يصف مزيج مجموعة الاختبار لا مزيج الوحدة","يأخذ أفضل الأرقام: الصور القياسية لا تُلتقط في العناية"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"hidden-stratification","title":"المتوسط يخفي الصور التي تخطئ فيها الأداة أكثر"},"level":"analyze","pool":"practice"},{"id":"q-alerts-05","type":"single","prompt":"قارئ الطوارئ يستطيع أن يقطع عمله لـ25 تنبيهًا في اليوم. العتبات الأربع تعطي 60 و24 و12 و6 تنبيهات يوميًا، وتفوّت 10 و22 و35 و50 حالة في الشهر. أي عتبة تختار؟","options":[{"key":"أ","text":"التي تعطي 60 تنبيهًا وتفوّت 10"},{"key":"ب","text":"التي تعطي 24 تنبيهًا وتفوّت 22"},{"key":"ج","text":"التي تعطي 12 تنبيهًا وتفوّت 35"},{"key":"د","text":"التي تعطي 6 تنبيهات وتفوّت 50"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"أدنى عتبة تبقى في طاقة القراءة الفورية تقرأ كل م فالدرجة تتطلب منه حاجة أكبر ليبلغ العتبة نفسها.","misconceptions":["يقارن الفئتين في المجتمع كله: المقارنة هنا عند الدرجة نفسها، بين المسجَّلين","","يرى اختيار الأشد عدلًا: من هو أقل مرضًا قليلًا من البادية يُستبعد، وهو أشد من مسجَّلي المدينة","يستهين بفرق يزيد على مرض كامل غير مضبوط لكل مريض"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"error-by-subgroup","title":"ثلاثة أرقام تكشف الفئة المتضررة"},"level":"analyze","pool":"practice"},{"id":"q-label-03","type":"numeric","prompt":"في فئة من المرضى 200 صاحب حاجة عالية، سُجِّل منهم في البرنامج 50. ما نسبة من فاتهم البرنامج من أصحاب الحاجة العالية في هذه الفئة؟","options":[],"correct":[],"answer":75,"tolerance":0,"unit":"%","explanation":"غير المسجَّلين 200 − 50 = 150، و150 ÷ 200 = 75%. هذا هو الخطأ بحسب الفئة: نسبة من فاتهم ما يحتاجون إليه.","misconceptions":[],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"error-by-subgroup","title":"ثلاثة أرقام تكشف الفئة المتضررة"},"level":"apply","pool":"practice"},{"id":"q-label-04","type":"single","prompt":"مراجعة الملفات تجد في المراكز الريفية 100 مرض مزمن، رُمِّز منها في النظام 55. وفي المدينة 100، رُمِّز منها 90. درجة تعتمد على الأمراض المرمَّزة. ما أثر ذلك؟","options":[{"key":"أ","text":"تخفض درجات المراكز الريفية، لأن ما لا يُرمَّز لا تراه الدرجة"},{"key":"ب","text":"لا أثر، لأن الدرجة تعدّ الأمراض بالطريقة نفسها في الموقعين"},{"key":"ج","text":"ترفع درجات المراكز الريفية، لأن أمراضها أشد"},{"key":"د","text":"تخفض درجات المدينة، لأن ترميزها أكثر اكتمالًا"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الدرجة ترى الرموز لا المريض. ترميز أقل اكتمالًا يجعل مرضى الريف يبدون أقل مرضًا مما هم، فتنخفض درجاتهم.","misconceptions":["","يخلط بين الطريقة الواحدة والبيانات الواحدة: الطريقة نفسها على بيانات ناقصة تعطي أقل","يفترض أن الدرجة ترى شدة المرض: هي ترى ما رُمِّز فقط","يعكس الأثر: الترميز الكامل يرفع الدرجة ولا يخفضها"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"coded-data","title":"الدرجة ترى الرموز، لا المريض"},"level":"analyze","pool":"practice"},{"id":"q-label-05","type":"single","prompt":"فريق يريد إرسال 5,000 سجل إلى مورِّد لتدقيق درجته. حذف الأسماء وأرقام الهوية، وأبقى العمر والجنس والقرية والأمراض. هل صارت البيانات مجهولة؟","options":[{"key":"أ","text":"نعم، لأن المعرِّفات المباشرة حُذفت"},{"key":"ب","text":"نعم، لأن البيانات تُرسل لغرض التدقيق فقط"},{"key":"ج","text":"لا، لأن السجلات ما زالت تحوي أعمارًا"},{"key":"د","text":"لا، لأن تجمّع السمات قد يدل على شخص بعينه"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"السمات معًا (العمر والجنس والقرية والأمراض) قد تشير إلى شخص واحد، خاصة في قرية صغيرة. البيانات الصحية حساسة، وإرسالها يحتاج إلى أساس نظامي وأقل الأعمدة اللازمة.","misconceptions":["يظن أن حذف الاسم والهوية يكفي: السمات غير المباشرة تعيد التعرف","يخلط بين الغرض والحماية: الغرض المشروع لا يجعل البيانات مجهولة","يرى الخطر في سمة واحدة: العمر وحده لا يدل على أحد، والخطر في تجمّع السمات",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"deidentification-limits","title":"حذف الاسم لا يجعل السجل مجهولًا"},"level":"understand","pool":"practice"},{"id":"q-notes-01","type":"single","prompt":"في الزيارة قالت المريضة إنها تأخذ مميِّعًا للدم منذ جلطة. الملاحظة المولَّدة ذكرت دواء الضغط وحده. كل جملة في الملاحظة صحيحة. كيف تصنّف ذلك؟","options":[{"key":"أ","text":"ملاحظة سليمة، لأن كل جملة فيها صحيحة"},{"key":"ب","text":"نتيجة مختلقة، لأن الملاحظة غيّرت قائمة الأدوية"},{"key":"ج","text":"إغفال غير جسيم، لأن دواء الضغط ذُكر"},{"key":"د","text":"إغفال جسيم، لأن غياب المميِّع قد يضر المريضة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"ما قيل في الزيارة ولم يُكتب إغفال، والمميِّع يغيّر قرارات علاجية كثيرة، فغيابه قد يضر. دقة الجمل المكتوبة لا تقيس ما لم يُكتب.","misconceptions":["يقيس الملاحظة بجملها وحدها: الإغفال لا جملة له","يخلط الإغفال بالاختلاق: لم تُضف الملاحظة شيئًا لم يُقل","يحكم بما ذُكر لا بما غاب: الجسامة تُقاس بأثر الغائب على المريض",""],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"omissions-and-inventions","title":"الإغفال لا جملة له، فلا تقيسه «دقة الجملة»"},"level":"analyze","pool":"practice"},{"id":"q-notes-02","type":"single","prompt":"مورِّد يقول إن أداته «توفّر 70% من وقت التوثيق». عندكم قياس سابق: 6 دقائق للكتابة اليدوية. في أسبوع تجريبي أخذت مراجعة الملاحظة المولَّدة وتصحيحها 3.6 دقيقة في المتوسط. ما التوفير المقيس؟","options":[{"key":"أ","text":"نحو 30%"},{"key":"ب","text":"نحو 40%"},{"key":"ج","text":"نحو 60%"},{"key":"د","text":"نحو 70%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"التوفير 1 − 3.6 ÷ 6 = 40%. المقارن هو الكتابة اليدوية في عياداتنا، والوقت يشمل المراجعة والتصحيح.","misconceptions":["يحسب نسبة الوقت المتبقي مقلوبة: 30% ليست 1 − 3.6 ÷ 6","","يقسم وقت المراجعة على الكتابة اليدوية ويقرأ الناتج توفيرًا: 3.6 ÷ 6 = 60% هو الوقت الباقي لا الموفَّر","يأخذ رقم المورِّد: القياس المحلي هو الدليل"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"ambient-claim","title":"«مُحرِّر» يعد بـ70% من وقت التوثيق"},"level":"evaluate","pool":"practice"},{"id":"q-notes-03","type":"single","prompt":"شبكة تريد أن تعرف أداء أداة توثيق على مرضاها الجدد قبل أن يعتمد الأطباء على ملاحظاتها. أي تصميم يفعل ذلك؟","options":[{"key":"أ","text":"تعمل على الزيارات وتُحفظ ملاحظاتها خارج الملف، ويقارنها مراجع بالنص"},{"key":"ب","text":"تعمل الأداة في عيادة واحدة ويستعمل أطباؤها ملاحظاتها، ثم يُسألون عن رضاهم"},{"key":"ج","text":"يُطلب من المورِّد تقرير أداء من مستشفيات أخرى استعملت الأداة"},{"key":"د","text":"تُختبر الأداة على عشرين زيارة قديمة، ثم تُشغَّل في كل العيادات"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"هذه تجربة صامتة: مرضى حقيقيون جدد، والمخرج لا يدخل الملف فلا يؤثر في قرار، ويُقارن بمرجع.","misconceptions":["","يعرّض المرضى قبل التحقق: الملاحظات دخلت الملف، والرضا لا يقيس الإغفال","ينقل التحقق إلى مواقع أخرى: الأداء لا ينتقل مع الأداة","يقفز من عينة صغيرة قديمة إلى التشغيل الكامل"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"validation-path","title":"ثلاث مراحل، ولكل منها من يوقّع"},"level":"understand","pool":"practice"},{"id":"q-notes-04","type":"single","prompt":"خطة لتجربة أداة توثيق تقول: «يراقب قسم الجودة أداء الأداة، ويُرفع تقرير عند الحاجة». ما الذي ينقصها أولًا؟","options":[{"key":"أ","text":"اسم المورِّد ورقم إصدار الأداة"},{"key":"ب","text":"مقياس محسوب ومسؤول مسمّى ومعيار إيقاف برقم"},{"key":"ج","text":"عدد العيادات التي ستعمل فيها الأداة بعد التشغيل"},{"key":"د","text":"استبانة لرضا الأطباء عن الملاحظات"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الخطة بلا مقياس محسوب، ولا مالك بالاسم، ولا رقم يوقف الأداة. «عند الحاجة» لا تحدد متى ولا من يقرر.","misconceptions":["يهتم بالوصف الإداري: الإصدار مهم لإعادة التحقق، لكن الخطة بلا مقياس لا تقيس شيئًا","","يخطط للتوسع قبل أن يعرف هل ينتقل","يضيف مقياسًا لا يرى الإغفال، ويترك الخطة بلا معيار إيقاف"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"plan-parts","title":"مقاييس، ومسؤول، ومعايير إيقاف بأرقام"},"level":"evaluate","pool":"practice"},{"id":"q-notes-05","type":"single","prompt":"قيّم فريق 20 ملاحظة، فوجد خطأ جسيمًا في 4 منها (20%). جدول حدود العينة يقول إن ذلك يتوافق مع نسبة حقيقية بين 8% و42%. ماذا تكتب في تقرير التحقق المحلي؟","options":[{"key":"أ","text":"نسبة الخطأ الجسيم في الأداة 20%"},{"key":"ب","text":"نسبة الخطأ الجسيم في الأداة 42% على الأسوأ، فنرفضها"},{"key":"ج","text":"وجدنا 4 من 20 (من 8% إلى 42%)، ونحتاج عينة أكبر"},{"key":"د","text":"العينة صغيرة، فلا نكتب أي نسبة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"العدد وحدود العينة معًا يقولان ما نعرف وما لا نعرف. القرار التالي عينة أكبر في التجربة الصامتة.","misconceptions":["يقرأ نسبة العينة حقيقة: 20 ملاحظة لا تحدد النسبة بدقة","يقرأ الحد الأعلى حكمًا: هو أسوأ ما يتوافق مع العينة، لا ما وُجد","","يهمل نتيجة مفيدة: العينة الصغيرة تكفي لتصميم الخطوة التالية"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"small-samples","title":"عشرون ملاحظة تكفي لتسأل، ولا تكفي لتحكم"},"level":"apply","pool":"practice"},{"id":"q-map-01","type":"single","prompt":"أداة تكتب ملخص زيارة للمريض بلغة بسيطة بعد أن يراجعه الطبيب. الخطأ قد يربك المريض لكنه لا يغيّر علاجه. ما مستوى مخاطرها في مقياس الخريطة؟","options":[{"key":"أ","text":"منخفض"},{"key":"ب","text":"متوسط"},{"key":"ج","text":"عالٍ"},{"key":"د","text":"لا يُحدد قبل التشغيل"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"لا تمس تشخيص المريض ولا علاجه، والضرر عند الخطأ غير جسيم: لا على السؤالين، فالمستوى منخفض.","misconceptions":["","يحسب الإرباك ضررًا جسيمًا: الضرر هنا يمكن تداركه ولا يغيّر العلاج","يرفع كل ما يصل إلى المريض إلى أعلى مستوى","يؤجل الحكم: المستوى يُحدد من الغرض والأثر قبل أي تشغيل"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"map-axes","title":"ثلاثة محاور لكل حالة استخدام"},"level":"apply","pool":"practice"},{"id":"q-map-02","type":"single","prompt":"حالتان في خريطتك: (أ) القيمة 5 والجاهزية 1 والمستوى عالٍ؛ (ب) القيمة 3 والجاهزية 5 والمستوى منخفض. تختار مشروعًا تجريبيًا واحدًا هذا العام. أي تعليل يصمد أمام المجلس؟","options":[{"key":"أ","text":"(أ)، لأن أعلى قيمة يجب أن تبدأ أولًا مهما كانت البيانات"},{"key":"ب","text":"(ب)، فحاصلها 15 مقابل 5، وأكتب ما يلزم (أ) لتجهز"},{"key":"ج","text":"(أ)، لأن الحالات العالية المخاطر أهم من غيرها"},{"key":"د","text":"لا هذه ولا تلك، لأن كلتيهما تنقصها بيانات"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"القيمة × الجاهزية ترتّب، و(ب) جاهزة ومنخفضة المخاطر. والخريطة لا تحذف (أ): تكتب ما يلزمها من بيانات ومراجع.","misconceptions":["يتجاهل الجاهزية: أداة بلا بيانات ولا مرجع لا يمكن التحقق منها","","يخلط المخاطر بالأولوية: المستوى العالي شرط، لا سبب للتقديم","يقرأ الجاهزية 5 نقصًا: (ب) بياناتها كاملة"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"map-ranking","title":"القيمة × الجاهزية ترتّب، ومستوى المخاطر يشترط"},"level":"evaluate","pool":"practice"},{"id":"q-map-03","type":"numeric","prompt":"حالة استخدام قيمتها 4 وجاهزية بياناتها 3. ما رتبتها في الخريطة بحاصل القيمة × الجاهزية؟","options":[],"correct":[],"answer":12,"tolerance":0,"unit":"","explanation":"الحاصل 4 × 3 = 12. ثم يُقرأ مع مستوى المخاطر: العالي لا يُحذف، بل يُشترط له.","misconceptions":[],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"map-ranking","title":"القيمة × الجاهزية ترتّب، ومستوى المخاطر يشترط"},"level":"apply","pool":"practice"},{"id":"q-map-04","type":"single","prompt":"في خريطة مشارك حالة عالية المخاطر، وفي عمود المراجع البشري: «فريق الجودة». ما الذي تقوله له قبل المناقشة؟","options":[{"key":"أ","text":"يكفي، فالفريق أوسع وأقدر من أي شخص بمفرده"},{"key":"ب","text":"احذف الحالة، فالحالات العالية لا تدخل الخريطة"},{"key":"ج","text":"سمِّ طبيبًا بعينه مراجعًا، واكتب كيف يستفسر المريض"},{"key":"د","text":"غيّر مستواها إلى متوسط حتى لا تحتاج إلى مراجع"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"قاعدة المقرر: كل حالة عالية تسمّي مراجعها البشري وطريقة استفسار المريض. «الفريق» لا يُسأل عن قرار.","misconceptions":["يذيب المساءلة في جماعة: لا أحد بعينه يُسأل","يحذف ما يجب اشتراطه: العالي يُشترط له ولا يُحذف","","يغيّر المستوى ليتجنب الشرط: المستوى يُحكم بالأسئلة لا بالرغبة"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"high-tier-rule","title":"كل حالة عالية المخاطر تسمّي مراجعها، وتكتب كيف يستفسر المريض"},"level":"evaluate","pool":"practice"},{"id":"q-map-05","type":"single","prompt":"حالة استخدام: التنبؤ بالطلب على أسرّة العناية. بيانات الدخول والخروج كاملة ومنظمة لخمس سنوات في نظام واحد، والإشغال الفعلي لكل يوم مسجل فيها مرجعًا نقيس عليه. ما درجة جاهزية البيانات في مقياس الخريطة؟","options":[{"key":"أ","text":"1"},{"key":"ب","text":"3"},{"key":"ج","text":"5"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"البيانات كاملة ومنظمة في نظام واحد، ولها مرجع محلي هو الإشغال الفعلي: هذا وصف الدرجة 5 في المقياس.","misconceptions":["يخلط جاهزية البيانات بمستوى المخاطر أو بالقيمة: لا شيء في الوصف ناقص","يقرأ الدرجة الوسطى اختيارًا آمنًا: 3 لبيانات ناقصة أو موزعة على نظامين",""],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"map-axes","title":"ثلاثة محاور لكل حالة استخدام"},"level":"apply","pool":"practice"}]}</script>
